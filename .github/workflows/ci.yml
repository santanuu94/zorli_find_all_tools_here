name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # npm ci's strict package.json/lock sync check rejects the committed lockfile
      # on Linux: it records Windows-resolved platform-specific optional native
      # bindings (Vite rolldown + Tailwind oxide + their wasm32-wasi/@emnapi
      # subtrees), e.g. "Missing: @emnapi/core / @emnapi/runtime from lock file".
      # The setup-node `cache: npm` step performs that same sync check, so it is
      # deliberately NOT enabled here - it fails before install ever executes.
      # Plain `npm install` resolves for the runner's own platform instead.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint (type-check)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build