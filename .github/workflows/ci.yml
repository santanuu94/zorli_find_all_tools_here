name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Root cause (Sep 2025): the lockfile committed from Windows recorded
      # Windows-resolved platform-specific optional bindings but `npm ci` on the
      # Pages Linux builder (and the setup-node cache step in CI) runs a strict
      # package.json/lock sync check and failed on the wasm32-wasi subtrees:
      # "Missing: @emnapi/core / @emnapi/runtime from lock file". Fixed by
      # regenerating package-lock.json so the `@emnapi/wasi-threads 1.2.3` /
      # `tslib 2.8.1` entries carry correct `dev`/`optional` flags; `npm ci`
      # --dry-run now passes locally and every pipeline uses `npm ci` again.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (type-check)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build