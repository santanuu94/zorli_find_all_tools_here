name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Root cause (Sep 2025): package-lock.json was missing the
      # `@emnapi/core` + `@emnapi/runtime` entries required by
      # `@tailwindcss/oxide-wasm32-wasi`'s bundleDependencies. Windows npm
      # 11.6 never enforces this, but npm 11.19 (node 24's bundled npm, i.e.
      # ubuntu-latest) fails: "Missing: @emnapi/core@1.11.3 from lock file"
      # followed by the full `npm ci` usage dump. Fixed by regenerating
      # package-lock.json with npm 11.19.0 inside a node:24 container;
      # `npm ci` verified exit 0 on Linux npm 11.19.0 AND Windows npm 11.6.2.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (type-check)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build