name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci is deliberately not used here: its strict package.json/package-lock.json
      # sync check rejects the committed lockfile on Linux because the lock records
      # Windows-resolved platform-specific optional dependencies (the Vite 8 rolldown and
      # Tailwind oxide native bindings plus their wasm32-wasi/@emnapi subtrees). That made
      # this step fail on every run, so Lint, Test and Build never executed.
      # npm install resolves for the runner's own platform and is not subject to that check.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint (type-check)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build