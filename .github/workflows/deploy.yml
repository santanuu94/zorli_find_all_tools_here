name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Same install rule as CI: plain `npm install`, no `cache: npm` - see
      # .github/workflows/ci.yml. The Windows-resolved Vite/Tailwind optional
      # native subtrees trip both `npm ci`'s and the cache step's sync check on
      # Linux ("Missing: @emnapi/core / @emnapi/runtime from lock file"), so
      # `cache: npm` fails the job before install ever executes.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      # `wrangler pages deploy` cannot create a missing --project-name in a
      # non-interactive context (CI, piped input), so the project is created first.
      # Wrangler is run directly instead of through wrangler-action so that its real
      # error text lands in the job summary as well as the log: the action only ever
      # reports "Action failed / npx failed with exit code 1", which hides the cause.
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail

          # Failure here is expected from the second run onwards ("already exists"),
          # so it is reported but not fatal - the deploy below is what matters.
          if ! npx --yes wrangler@4 pages project create zorli --production-branch=main > create.log 2>&1; then
            {
              echo '`pages project create` output (expected once the project exists):'
              echo '```'
              tail -n 25 create.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if npx --yes wrangler@4 pages deploy dist --project-name=zorli --branch=main 2>&1 | tee deploy.log; then
            echo 'Deployed `dist` to Cloudflare Pages (project `zorli`).' >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo 'Deploy failed. Last 40 lines of wrangler output:'
              echo '```'
              tail -n 40 deploy.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            # Job logs require authentication to download, so echo the cause as an
            # annotation instead - annotations are readable from the public checks API
            # (and rendered at the top of the failing file/step in the UI).
            detail=$(sed -e 's/\x1b\[[0-9;]*m//g' deploy.log | grep -aiE 'error|authentication|unauthor|invalid|denied|forbidden|not found|code:' | tail -n 5 | tr '\n' ' ' | cut -c1-900)
            [ -n "$detail" ] || detail=$(sed -e 's/\x1b\[[0-9;]*m//g' deploy.log | tail -n 5 | tr '\n' ' ')
            echo "::error title=Cloudflare Pages deploy failed::$detail"
            exit 1
          fi