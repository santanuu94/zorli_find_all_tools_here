name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # See .github/workflows/ci.yml for why npm ci is not used: the lockfile records
      # Windows-resolved platform-specific optional dependencies, which npm ci rejects on
      # Linux and which blocked this step on every previous run.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      # In a non-interactive context (CI, piped input) `wrangler pages deploy` refuses
      # to create a --project-name that does not exist yet: it exits 1 with "project
      # not found". Create the project explicitly first. This step is idempotent - on
      # later runs it fails with "already exists", which continue-on-error tolerates
      # because the next step is the one that actually publishes.
      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create zorli --production-branch=main

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zorli --branch=main