<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="starGrad" x1="10" y1="10" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- 4-point sparkle star -->
    <path d="M40 12 C40 27 45 32 60 40 C45 48 40 53 40 68 C40 53 35 48 20 40 C35 32 40 27 40 12 Z" fill="url(#starGrad)" />
    <!-- Secondary mini sparkles -->
    <path d="M58 20 C58 24 59 26 63 28 C59 30 58 32 58 36 C58 32 57 30 53 28 C57 26 58 24 58 20 Z" fill="#A78BFA" opacity="0.9" />
  </g>
  <!-- Brand text Zorli -->
  <text x="82" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="#0F172A" letter-spacing="-0.03em">Zorli</text>
</svg>
