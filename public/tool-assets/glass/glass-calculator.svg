<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 130" fill="none">
  <defs>
    <!-- Vibrant Emerald-Teal Crystal Glass with High Opacity -->
    <linearGradient id="calcGlassBody" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98" />
      <stop offset="20%" stop-color="#D1FAE5" stop-opacity="0.96" />
      <stop offset="45%" stop-color="#10B981" stop-opacity="0.98" />
      <stop offset="75%" stop-color="#059669" stop-opacity="1" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="1" />
    </linearGradient>

    <!-- Specular Bevel Rim Light -->
    <linearGradient id="calcGlassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="40%" stop-color="#A7F3D0" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#34D399" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#047857" stop-opacity="1" />
    </linearGradient>

    <!-- LCD Display Glass Screen -->
    <linearGradient id="calcScreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022C22" />
      <stop offset="50%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>

    <!-- Keys Glow -->
    <linearGradient id="keyGlassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#D1FAE5" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="accentKeyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="calcGlassGlow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#059669" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#022C22" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#calcGlassGlow)">
    <!-- 3D Beveled Rounded Glass Body -->
    <rect
      x="16"
      y="8"
      width="78"
      height="114"
      rx="22"
      fill="url(#calcGlassBody)"
      stroke="url(#calcGlassRim)"
      stroke-width="2.5"
    />

    <!-- Diagonal Glass Refraction Slice -->
    <path
      d="M18 12 L92 78 L84 94 L18 42 Z"
      fill="#FFFFFF"
      fill-opacity="0.45"
    />

    <!-- Top Left Specular Highlight Glint -->
    <circle cx="24" cy="16" r="3.5" fill="#FFFFFF" opacity="0.95" />

    <!-- High-Contrast Glass Display Screen -->
    <rect
      x="25"
      y="20"
      width="60"
      height="26"
      rx="9"
      fill="url(#calcScreenGrad)"
      stroke="#6EE7B7"
      stroke-width="1.8"
    />
    <!-- LCD Readout Digits -->
    <text
      x="78"
      y="38"
      text-anchor="end"
      font-family="monospace, monospace"
      font-weight="900"
      font-size="16"
      fill="#6EE7B7"
      letter-spacing="0.1em"
      filter="drop-shadow(0 0 4px #34D399)"
    >
      128.5
    </text>

    <!-- Keypad Grid (3D Glass Floating Buttons with High Contrast) -->
    <!-- Row 1 -->
    <rect x="26" y="56" width="16" height="13" rx="4.5" fill="url(#keyGlassGrad)" stroke="#FFFFFF" stroke-width="1.2" />
    <text x="34" y="66" text-anchor="middle" font-size="10" font-weight="900" fill="#065F46">7</text>

    <rect x="47" y="56" width="16" height="13" rx="4.5" fill="url(#keyGlassGrad)" stroke="#FFFFFF" stroke-width="1.2" />
    <text x="55" y="66" text-anchor="middle" font-size="10" font-weight="900" fill="#065F46">8</text>

    <rect x="68" y="56" width="16" height="13" rx="4.5" fill="url(#accentKeyGrad)" stroke="#FFFFFF" stroke-width="1.2" />
    <text x="76" y="66" text-anchor="middle" font-size="11" font-weight="900" fill="#78350F">÷</text>

    <!-- Row 2 -->
    <rect x="26" y="74" width="16" height="13" rx="4.5" fill="url(#keyGlassGrad)" stroke="#FFFFFF" stroke-width="1.2" />
    <text x="34" y="84" text-anchor="middle" font-size="10" font-weight="900" fill="#065F46">4</text>

    <rect x="47" y="74" width="16" height="13" rx="4.5" fill="url(#keyGlassGrad)" stroke="#FFFFFF" stroke-width="1.2" />
    <text x="55" y="84" text-anchor="middle" font-size="10" font-weight="900" fill="#065F46">5</text>

    <rect x="68" y="74" width="16" height="13" rx="4.5" fill="url(#accentKeyGrad)" stroke="#FFFFFF" stroke-width="1.2" />
    <text x="76" y="84" text-anchor="middle" font-size="11" font-weight="900" fill="#78350F">×</text>

    <!-- Row 3 -->
    <rect x="26" y="92" width="16" height="13" rx="4.5" fill="url(#keyGlassGrad)" stroke="#FFFFFF" stroke-width="1.2" />
    <text x="34" y="102" text-anchor="middle" font-size="10" font-weight="900" fill="#065F46">1</text>

    <rect x="47" y="92" width="16" height="13" rx="4.5" fill="url(#keyGlassGrad)" stroke="#FFFFFF" stroke-width="1.2" />
    <text x="55" y="102" text-anchor="middle" font-size="10" font-weight="900" fill="#065F46">2</text>

    <rect x="68" y="92" width="16" height="13" rx="4.5" fill="url(#accentKeyGrad)" stroke="#FFFFFF" stroke-width="1.2" />
    <text x="76" y="102" text-anchor="middle" font-size="12" font-weight="900" fill="#78350F">=</text>
  </g>
</svg>
