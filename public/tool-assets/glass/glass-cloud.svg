<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none">
  <defs>
    <!-- Vibrant Cyan-Sky Crystal Glass with High Opacity -->
    <linearGradient id="cloudGlassBody" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98" />
      <stop offset="20%" stop-color="#BAE6FD" stop-opacity="0.96" />
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.98" />
      <stop offset="75%" stop-color="#0284C7" stop-opacity="1" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="1" />
    </linearGradient>

    <!-- Glass Specular Rim -->
    <linearGradient id="cloudGlassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="35%" stop-color="#E0F2FE" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#7DD3FC" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="1" />
    </linearGradient>

    <!-- Upload Arrow Gradient -->
    <linearGradient id="cloudArrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <filter id="cloudGlassGlow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0284C7" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#082F49" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#cloudGlassGlow)">
    <!-- Aerodynamic 3D Glass Cloud Silhouette -->
    <path
      d="M32 76 C20 76 10 66 10 54 C10 42.5 19 33 30 32.2 C33.5 20 44.5 11 58 11 C72.5 11 84.5 21.5 87 35.5 C98 37 106 46 106 57 C106 67.5 97.5 76 87 76 Z"
      fill="url(#cloudGlassBody)"
      stroke="url(#cloudGlassRim)"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- Diagonal Glass Refraction -->
    <path
      d="M38 18 L96 74 L84 76 L28 32 Z"
      fill="#FFFFFF"
      fill-opacity="0.4"
    />

    <!-- Top Dome Specular Glint Highlight -->
    <path d="M50 14 C54 13 62 13 66 14" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />

    <!-- Sculpted Glass Upload Arrow in High-Contrast Relief -->
    <g transform="translate(48, 38)">
      <path
        d="M12 4 L3 14 C1.5 16 2.5 18 5 18 L8 18 L8 32 C8 33.5 9.5 35 11 35 C12.5 35 14 33.5 14 32 L14 18 L17 18 C19.5 18 20.5 16 19 14 L12 4 Z"
        fill="url(#cloudArrowGrad)"
        stroke="#0369A1"
        stroke-width="1.8"
        stroke-linejoin="round"
        filter="drop-shadow(0 2px 5px rgba(0,0,0,0.3))"
      />
      <!-- Specular highlight on arrow tip -->
      <circle cx="12" cy="7" r="2.2" fill="#FFFFFF" />
    </g>

    <circle cx="30" cy="36" r="3" fill="#FFFFFF" opacity="0.95" />
    <circle cx="94" cy="46" r="3" fill="#FFFFFF" opacity="0.95" />
  </g>
</svg>
