<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 110" fill="none">
  <defs>
    <!-- Vibrant Amethyst / Violet Glass with High Opacity -->
    <linearGradient id="codeGlassBody" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98" />
      <stop offset="20%" stop-color="#DDD6FE" stop-opacity="0.96" />
      <stop offset="45%" stop-color="#8B5CF6" stop-opacity="0.98" />
      <stop offset="75%" stop-color="#6D28D9" stop-opacity="1" />
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="1" />
    </linearGradient>

    <!-- Specular Rim Light -->
    <linearGradient id="codeGlassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="40%" stop-color="#EDE9FE" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#A78BFA" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#5B21B6" stop-opacity="1" />
    </linearGradient>

    <!-- Glowing Electric Magenta-Violet Slash -->
    <linearGradient id="codeSlashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#F472B6" />
      <stop offset="75%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <filter id="codeGlassGlow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#7C3AED" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2E1065" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#codeGlassGlow)">
    <!-- Left Glass Angle Bracket `<` -->
    <path
      d="M44 26 L18 52 C16.5 53.5 16.5 56.5 18 58 L44 84 C46 86 49 86 51 84 L53 82 C55 80 55 77 53 75 L33 55 L53 35 C55 33 55 30 53 28 L51 26 C49 24 46 24 44 26 Z"
      fill="url(#codeGlassBody)"
      stroke="url(#codeGlassRim)"
      stroke-width="2.5"
      stroke-linejoin="round"
    />
    <!-- Specular highlight on left bracket corner -->
    <circle cx="20" cy="55" r="3.5" fill="#FFFFFF" opacity="0.95" />
    <!-- Bevel highlight line on top ridge -->
    <path d="M44 27 L22 49" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.8" stroke-linecap="round" />

    <!-- Center 3D Glass Forward Slash `/` with internal glow -->
    <path
      d="M68 18 C71 18 73 20 72 23 L58 89 C57 92 55 94 52 94 C49 94 47 92 48 89 L62 23 C63 20 65 18 68 18 Z"
      fill="url(#codeSlashGrad)"
      stroke="#FFFFFF"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <!-- Bright Specular stripe on slash -->
    <line x1="68" y1="22" x2="56" y2="78" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Right Glass Angle Bracket `>` -->
    <path
      d="M86 26 C84 24 81 24 79 26 L77 28 C75 30 75 33 77 35 L97 55 L77 75 C75 77 75 80 77 82 L79 84 C81 86 84 86 86 84 L112 58 C113.5 56.5 113.5 53.5 112 52 L86 26 Z"
      fill="url(#codeGlassBody)"
      stroke="url(#codeGlassRim)"
      stroke-width="2.5"
      stroke-linejoin="round"
    />
    <!-- Specular highlight on right bracket corner -->
    <circle cx="110" cy="55" r="3.5" fill="#FFFFFF" opacity="0.95" />
    <!-- Bevel highlight line on top ridge -->
    <path d="M86 27 L108 49" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>
