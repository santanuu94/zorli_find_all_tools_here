<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110" fill="none">
  <defs>
    <!-- Vibrant Cerulean-Cyan Crystal Glass with High Opacity -->
    <linearGradient id="imgGlassBody" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98" />
      <stop offset="20%" stop-color="#E0F2FE" stop-opacity="0.96" />
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.98" />
      <stop offset="75%" stop-color="#0284C7" stop-opacity="1" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="1" />
    </linearGradient>

    <!-- Specular Bevel Rim Light -->
    <linearGradient id="imgGlassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="40%" stop-color="#BAE6FD" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="1" />
    </linearGradient>

    <!-- Golden Sun Gradient -->
    <linearGradient id="imgSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Mountain Crest Gradients -->
    <linearGradient id="mtnRearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="mtnFrontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.95" />
    </linearGradient>

    <filter id="imgGlassGlow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0284C7" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#082F49" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#imgGlassGlow)">
    <!-- 3D Beveled Rounded Glass Picture Frame -->
    <rect
      x="12"
      y="12"
      width="96"
      height="86"
      rx="20"
      fill="url(#imgGlassBody)"
      stroke="url(#imgGlassRim)"
      stroke-width="2.5"
    />

    <!-- Diagonal Glass Refraction Slice -->
    <path
      d="M14 14 L106 68 L98 84 L14 44 Z"
      fill="#FFFFFF"
      fill-opacity="0.45"
    />

    <!-- Luminous Golden Glass Sun in Sky -->
    <circle
      cx="40"
      cy="40"
      r="13"
      fill="url(#imgSunGrad)"
      stroke="#FFFFFF"
      stroke-width="2"
      filter="drop-shadow(0 2px 8px rgba(245,158,11,0.6))"
    />
    <circle cx="36" cy="36" r="3.5" fill="#FFFFFF" opacity="0.95" />

    <!-- Back Mountain Crest -->
    <path
      d="M52 88 L72 56 C73.5 53.5 76.5 53.5 78 56 L104 88 Z"
      fill="url(#mtnRearGrad)"
      stroke="#FFFFFF"
      stroke-width="1.8"
      stroke-linejoin="round"
    />

    <!-- Front Mountain Crest with Snow Peak -->
    <path
      d="M16 94 L44 48 C45.5 45.5 48.5 45.5 50 48 L76 94 Z"
      fill="url(#mtnFrontGrad)"
      stroke="#FFFFFF"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <!-- Specular Rim Highlights -->
    <circle cx="20" cy="20" r="3" fill="#FFFFFF" opacity="0.95" />
    <circle cx="100" cy="24" r="2.5" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
