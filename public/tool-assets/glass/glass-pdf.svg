<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 130" fill="none">
  <defs>
    <!-- Vibrant Ruby-Crimson Crystal Glass Fill with High Opacity -->
    <linearGradient id="pdfGlassBody" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98" />
      <stop offset="20%" stop-color="#FFE4E6" stop-opacity="0.96" />
      <stop offset="45%" stop-color="#FB7185" stop-opacity="0.98" />
      <stop offset="75%" stop-color="#E11D48" stop-opacity="1" />
      <stop offset="100%" stop-color="#9F1239" stop-opacity="1" />
    </linearGradient>

    <!-- Specular Bevel Rim Light -->
    <linearGradient id="pdfGlassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="40%" stop-color="#FECDD3" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#FB7185" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#9F1239" stop-opacity="1" />
    </linearGradient>

    <!-- Crisp White Glass Text Fill -->
    <linearGradient id="pdfTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFF1F2" />
      <stop offset="100%" stop-color="#FECDD3" />
    </linearGradient>

    <filter id="pdfGlassGlow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#E11D48" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#4C0519" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#pdfGlassGlow)">
    <!-- 3D Beveled Glass Document Silhouette -->
    <path
      d="M20 12 C20 7.5 23.5 4 28 4 L68 4 L92 28 L92 116 C92 120.5 88.5 124 84 124 L28 124 C23.5 124 20 120.5 20 116 Z"
      fill="url(#pdfGlassBody)"
      stroke="url(#pdfGlassRim)"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- Diagonal Glass Refraction Slices -->
    <path
      d="M22 6 L90 86 L80 102 L22 36 Z"
      fill="#FFFFFF"
      fill-opacity="0.45"
    />
    <path
      d="M24 64 L74 122 L62 122 L24 80 Z"
      fill="#FFFFFF"
      fill-opacity="0.25"
    />

    <!-- Folded Dog-Ear Corner -->
    <path
      d="M68 4 L68 22 C68 25.5 70.5 28 74 28 L92 28 Z"
      fill="#FFFFFF"
      fill-opacity="0.85"
      stroke="#FFFFFF"
      stroke-width="1.5"
      stroke-linejoin="round"
    />

    <!-- Top Left Specular Highlight Glint -->
    <circle cx="26" cy="10" r="3.5" fill="#FFFFFF" opacity="0.95" />

    <!-- Embossed Glass PDF Wordmark in White Relief -->
    <text
      x="56"
      y="84"
      text-anchor="middle"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="900"
      font-size="28"
      letter-spacing="0.08em"
      fill="url(#pdfTextGrad)"
      stroke="#9F1239"
      stroke-width="1.2"
      filter="drop-shadow(0 2px 4px rgba(0,0,0,0.4))"
    >
      PDF
    </text>

    <!-- Document Line Accents -->
    <rect x="36" y="96" width="38" height="3.5" rx="1.75" fill="#FFFFFF" fill-opacity="0.95" />
    <rect x="42" y="104" width="26" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.75" />
  </g>
</svg>
