<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" fill="none">
  <defs>
    <!-- Radiant Topaz/Amber Gold Glass with High Opacity -->
    <linearGradient id="textGlassBody" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98" />
      <stop offset="20%" stop-color="#FEF3C7" stop-opacity="0.96" />
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.98" />
      <stop offset="75%" stop-color="#D97706" stop-opacity="1" />
      <stop offset="100%" stop-color="#92400E" stop-opacity="1" />
    </linearGradient>

    <!-- Specular Rim Gradient -->
    <linearGradient id="textGlassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="35%" stop-color="#FEF3C7" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#FBBF24" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="1" />
    </linearGradient>

    <filter id="textGlassGlow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#D97706" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#451A03" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#textGlassGlow)">
    <!-- 3D Sculpted Glass Letter 'T' -->
    <path
      d="M18 20 C18 16.5 20.5 14 24 14 L86 14 C89.5 14 92 16.5 92 20 L92 34 C92 37 89 39 86 39 L66 39 L66 90 C66 93.5 63.5 96 60 96 L50 96 C46.5 96 44 93.5 44 90 L44 39 L24 39 C21 39 18 37 18 34 Z"
      fill="url(#textGlassBody)"
      stroke="url(#textGlassRim)"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- Diagonal Glass Refraction Stripe Across Crossbar -->
    <path
      d="M20 18 L88 34 L78 38 L20 28 Z"
      fill="#FFFFFF"
      fill-opacity="0.45"
    />
    <!-- Vertical Stem Reflection Stripe -->
    <path
      d="M46 38 L64 88 L58 92 L44 48 Z"
      fill="#FFFFFF"
      fill-opacity="0.35"
    />

    <!-- Top Left Corner Specular Highlight Glint -->
    <circle cx="22" cy="18" r="3.5" fill="#FFFFFF" opacity="0.95" />
    <!-- Right Corner Highlight -->
    <circle cx="88" cy="18" r="3" fill="#FFFFFF" opacity="0.9" />
    <!-- Stem Bottom Highlight -->
    <circle cx="48" cy="92" r="3" fill="#FFFFFF" opacity="0.85" />
  </g>
</svg>
